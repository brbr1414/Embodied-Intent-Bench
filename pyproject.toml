[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerointentbench"
version = "0.1.0.dev0"
description = "A benchmark for intent-conditioned, resource-aware inference configuration selection in UAV missions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "brbr1414" }]
keywords = ["benchmark", "uav", "edge-inference", "adaptive-inference"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# V1 has no runtime dependencies on purpose: the benchmark must run without a
# GPU and without heavy ML packages. See docs/v1_spec.md ("Dependency policy").
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# V2 visual closed loop only. The V1 core stays runtime-dependency-free; nothing under
# aerointentbench/ imports these unless the aerointentbench.v2 subpackage is used.
# rasterio is needed only for GeoTIFF worlds (windowed reads); PNG/JPEG worlds need Pillow.
v2 = ["numpy>=2.0", "pillow>=10.0", "rasterio>=1.4"]
# V2.1 real model-strategies (torchvision semantic segmentation). Heavy on purpose and
# never imported unless a torch_semantic_segmentation executor is actually requested;
# the default install and the default test suite need none of this.
v2-real-models = ["torch>=2.2", "torchvision>=0.17"]
# Pre-split models published by prior split-computing research (V3x model catalog).
# Only the sc2_entropic_student backend needs this; the default suite uses fixtures.
v2-presplit = ["torch>=2.2", "torchvision>=0.17", "sc2bench>=0.1.1"]
v2-onnx = ["onnxruntime>=1.20"]

[project.scripts]
aerointentbench = "aerointentbench.run_benchmark:main"

[project.urls]
Repository = "https://github.com/brbr1414/Embodied-Intent-Bench"

[tool.hatch.build.targets.wheel]
packages = ["aerointentbench"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not real_models and not real_assets'"
markers = [
    "real_models: opt-in tests that load actual pretrained weights (run: pytest -m real_models)",
    "real_assets: opt-in tests that need the owner-supplied local human assets (src/v2_img/human, data/v2_assets/generated)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The embedded HTML/CSS/JS viewer template: physical line length is part of the
# emitted page, not Python style.
"aerointentbench/v2/replay_viewer.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aerointentbench"]
